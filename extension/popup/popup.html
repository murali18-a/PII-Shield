<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PII-Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="shield-icon">🛡️</span>
        <h1>PII-Shield</h1>
      </div>
      <div class="status" id="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Checking…</span>
      </div>
    </header>

    <!-- Toggle -->
    <div class="toggle-section">
      <label class="toggle-label" for="enable-toggle">
        Protection Enabled
      </label>
      <label class="toggle-switch">
        <input type="checkbox" id="enable-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Engine Info -->
    <div class="engine-info" id="engine-info" style="display:none">
      <div class="info-row">
        <span class="info-label">Engine</span>
        <span class="info-value" id="engine-type">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Model</span>
        <span class="info-value" id="engine-model">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Sessions</span>
        <span class="info-value" id="engine-sessions">—</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-section">
      <div class="stat-card">
        <span class="stat-value" id="stat-redacted">0</span>
        <span class="stat-label">Entities Redacted</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-requests">0</span>
        <span class="stat-label">Requests Protected</span>
      </div>
    </div>

    <!-- Recent Detections -->
    <div class="detections-section">
      <h2>Recent Detections</h2>
      <ul id="detections-list" class="detections-list">
        <li class="empty-state">No detections yet</li>
      </ul>
    </div>

    <!-- Actions -->
    <div class="actions-section">
      <a href="../demo/demo.html" target="_blank" class="action-link" id="demo-link">
        🧪 Open Demo Page
      </a>
      <a href="#" class="action-link" id="dashboard-link">
        📊 Open Dashboard
      </a>
    </div>

    <!-- Privacy -->
    <div class="privacy-bar">
      🔒 All processing is local. No data leaves your machine.
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v0.2.0</span>
      <span>IBM Z Datathon 2026</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
